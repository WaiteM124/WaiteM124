# Link checker config for the profile README repo.
# Do not weaken fail_if_empty / treat failures as success — CI must fail on real breaks.

#############################  Display  #############################
verbose = "warning"
no_progress = true

#############################  Cache  ###############################
cache = false

#############################  Runtime  #############################
max_concurrency = 8
timeout = 30
retry_wait_time = 2
max_retries = 2

#############################  Requests  ############################
user_agent = "Mozilla/5.0 (compatible; lychee/waite-m124-profile; +https://github.com/WaiteM124/WaiteM124)"
accept = ["200..=299"]

#############################  Exclusions  ##########################
# LinkedIn returns HTTP 999 to automated checkers (bot protection).
# Follow-up: periodically verify the LinkedIn URL manually.
exclude = [
  '^https://www\.linkedin\.com/',
  '^https://linkedin\.com/',
]

exclude_path = []

scheme = ["https", "http"]
include_mail = false
